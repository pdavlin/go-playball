name: Build Main

on:
  push:
    branches: [main]

concurrency:
  group: build-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Vet
        run: go vet ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          BINARY_NAME="go-playball"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME="go-playball.exe"
          fi
          go build -ldflags "-s -w \
            -X github.com/pdavlin/go-playball/internal/buildinfo.version=nightly-${GITHUB_SHA::7} \
            -X github.com/pdavlin/go-playball/internal/buildinfo.commit=${GITHUB_SHA::7} \
            -X github.com/pdavlin/go-playball/internal/buildinfo.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "dist/${BINARY_NAME}" \
            ./cmd/go-playball/

      - name: Package archive
        run: |
          ARCHIVE_NAME="go-playball_${{ matrix.goos }}_${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cd dist && zip "../${ARCHIVE_NAME}.zip" go-playball.exe
          else
            tar -czf "${ARCHIVE_NAME}.tar.gz" -C dist go-playball
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-playball_${{ matrix.goos }}_${{ matrix.goarch }}
          path: go-playball_*.*
          retention-days: 1

  smoke-test:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build native binary
        run: |
          go build -ldflags "\
            -X github.com/pdavlin/go-playball/internal/buildinfo.version=nightly-${GITHUB_SHA::7} \
            -X github.com/pdavlin/go-playball/internal/buildinfo.commit=${GITHUB_SHA::7} \
            -X github.com/pdavlin/go-playball/internal/buildinfo.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o go-playball \
            ./cmd/go-playball/

      - name: Smoke test version output
        run: |
          OUTPUT=$(./go-playball version)
          echo "Version output: ${OUTPUT}"
          SHORT_SHA="${GITHUB_SHA::7}"
          if echo "${OUTPUT}" | grep -q "${SHORT_SHA}"; then
            echo "✅ Commit SHA found in version output"
          else
            echo "❌ Expected commit SHA '${SHORT_SHA}' in output"
            exit 1
          fi

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum go-playball_*.tar.gz go-playball_*.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Create/update nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build
          body: |
            Automated build from `main` branch.
            Commit: ${{ github.sha }}
            Date: ${{ github.event.head_commit.timestamp }}

            ⚠️ This is a prerelease — built from the latest main. For stable releases, see tagged versions.
          prerelease: true
          make_latest: false
          files: |
            artifacts/go-playball_*.tar.gz
            artifacts/go-playball_*.zip
            artifacts/SHA256SUMS
